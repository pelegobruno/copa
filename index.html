<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copa do Mundo 2026</title>
    
    <link rel="icon" type="image/png" href="./public/taca_icon.png?v=3">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

    <header class="app-header">
        <div class="container header-content">
            <div class="title-logo-wrapper">
                <h1>Copa do Mundo</h1>
                <img src="./public/logo-fifa.jpg" alt="Logo FIFA 2026" class="logo-copa-img">
            </div>
        </div>
    </header>

    <nav class="app-nav">
        <div class="container nav-container">
            <div class="search-bar-wrapper">
                <input type="text" id="search-input" class="search-input" placeholder="Pesquisar seleção...">
            </div>
            <div class="menu-wrapper" id="menu"></div>
        </div>
    </nav>

    <main class="app-main">
        <div class="container">
            <div class="section-title">
                <h2 id="fase-titulo">Carregando...</h2>
            </div>
            
            <div id="classificacao-container" class="tabelas-grid"></div>
            <h3 id="jogos-titulo" class="jogos-titulo" style="display: none;"></h3>
            <div id="jogos-container" class="jogos-grid"></div>
        </div>
    </main>

    <!-- Modal de Edição de Placar -->
    <div id="modal-placar" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3 class="modal-title">Atualizar Placar</h3>
            <p id="modal-teams" class="modal-teams">Time A x Time B</p>
            
            <div class="modal-inputs-group">
                <input type="number" id="gols-t1" class="placar-input" min="0" placeholder="0">
                <span class="modal-divisor">X</span>
                <input type="number" id="gols-t2" class="placar-input" min="0" placeholder="0">
            </div>

            <div id="modal-penaltis-area" class="modal-penaltis-area" style="display: none;">
                <h4 class="penaltis-title">Disputa de Pênaltis</h4>
                <div class="modal-inputs-group penaltis-group">
                    <input type="number" id="pen-t1" class="placar-input pen-input" min="0" placeholder="0">
                    <span class="modal-divisor">X</span>
                    <input type="number" id="pen-t2" class="placar-input pen-input" min="0" placeholder="0">
                </div>
            </div>

            <div class="modal-actions">
                <button id="btn-cancelar" class="btn-cancelar">Cancelar</button>
                <button id="btn-salvar" class="btn-salvar">Salvar Resultado</button>
            </div>
        </div>
    </div>

    <!-- Modal de Elenco (Convocados) -->
    <div id="modal-elenco" class="modal-overlay" style="display: none;" onclick="if(event.target === this) fecharElenco()">
        <div class="modal-box elenco-box">
            <div class="elenco-header">
                <div class="elenco-header-title">
                    <img id="elenco-bandeira" src="" alt="Bandeira" class="bandeira-img" style="width: 28px; height: 20px;">
                    <h3 id="elenco-titulo" class="modal-title" style="margin:0;">Seleção</h3>
                </div>
                <button class="btn-fechar" onclick="fecharElenco()">×</button>
            </div>
            <div class="elenco-info-bar">Lista de 23 Convocados Oficiais</div>
            <div class="elenco-lista" id="elenco-lista"></div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <!-- Scripts da Aplicação (O jogadores.js entrega o banco de atletas global) -->
    <script src="jogadores.js"></script>
    <script src="dados.js"></script>
    <script src="script.js"></script>
</body>
</html>
